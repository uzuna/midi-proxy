[package]
name = "midi-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
bytes = "1.11.1"
clap = { version = "4.5.60", features = ["derive", "env"] }
futures = "0.3.32"
midir = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.0.3"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["codec"] }
tracing = "0.1.44"

[dev-dependencies]
